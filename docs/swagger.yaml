      - BearerAuth: []
      summary: Текущий прогресс просмотра видео
      tags:
      - watch-progress
    post:
      consumes:
      - application/json
      description: |-
        Принимает отрезок непрерывного воспроизведения от плеера и обновляет прогресс
        просмотра инициатора по видео — усекает перемотку, ограничивает покрытие
        временем у стены, отбрасывает интервалы со скоростью выше 1.0 и идемпотентен
        при повторе (session_id, seq), §3 дизайна эпика Э3.
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы
        in: path
        name: userGroupId
        required: true
        type: string
      - description: ID видео
        in: path
        name: videoId
        required: true
        type: string
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WatchHeartbeatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.WatchProgressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Heartbeat прогресса просмотра видео
      tags:
      - watch-progress
