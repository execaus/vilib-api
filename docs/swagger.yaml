      - application/json
      description: |-
        Меняет пароль текущей строки пользователя (организация из JWT). Неверный старый
        пароль или новый пароль, совпадающий со старым либо короче минимальной длины —
        400.
      parameters:
      - description: Тело запроса для смены пароля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Смена пароля
      tags:
      - auth
  /api/v1/auth/password/forgot:
    post:
      consumes:
      - application/json
      description: |-
        Отправляет письмо со ссылкой (или списком ссылок по организациям, если email
        состоит в нескольких) для сброса пароля. Ответ всегда 200, независимо от
        существования email или организации.
      parameters:
      - description: Тело запроса для сброса пароля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ForgotPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      summary: Запрос сброса пароля
      tags:
      - auth
  /api/v1/auth/password/reset:
    post:
      consumes:
      - application/json
      description: |-
        Обновляет пароль строки пользователя, которой принадлежит токен из письма.
        Несуществующий, использованный или просроченный токен — 400 validation.reset_token.
      parameters:
      - description: Тело запроса для сброса пароля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      summary: Сброс пароля по токену
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт пользователя, аккаунт, назначает роль администратора и
        возвращает токен авторизации
      parameters:
      - description: Тело запроса для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /api/v1/auth/switch-account:
    post:
      consumes:
      - application/json
      description: |-
        Выпускает новый токен с текущей организацией сессии, переключённой на
        организацию, где у пользователя есть активная строка (§2.4 дизайна эпика Э2)
      parameters:
      - description: Организация для переключения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SwitchAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SwitchAccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Переключение организации
      tags:
      - auth
  /api/v1/config:
    get:
      description: |-
        Возвращает лимиты и параметры загрузки видео, время жизни ссылок и токенов,
        набор профилей качества HLS — без авторизации, чтобы форма загрузки могла
        валидировать файл до входа в систему не дублируя константы на фронте.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ConfigResponse'
      summary: Публичный конфиг фронтенда
      tags:
      - config
  /api/v1/me:
    get:
      description: |-
        Возвращает агрегированный контекст текущего пользователя: организацию, роль,
        признак владельца и членства в группах (§2.3 дизайна эпика Э2)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      security:
      - BearerAuth: []
      summary: Профиль текущего пользователя
      tags:
      - profile
  /api/v1/me/assignments:
    get:
      description: |-
        Возвращает назначения текущего пользователя во всех статусах вместе со
        сводкой активных и просроченных (§4, §5 дизайна эпика Э3) — используется для
        экрана «Мои назначения», бейджей в каталоге/плеере и счётчика в навигации.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MyAssignmentsResponse'
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Мои назначения
      tags:
      - assignments
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
