basePath: /api/v1
definitions:
  domain.PermissionMask:
    enum:
    - 0
    format: int64
    type: integer
    x-enum-varnames:
    - DefaultPermissionMask
  dto.AccountBrief:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.AccountRole:
    properties:
      id:
        type: string
      is_default:
        type: boolean
      is_system:
        description: |-
          IsSystem — признак системной роли (например, владелец аккаунта), созданной автоматически
          и недоступной для удаления/переименования (§3.4 дизайна эпика Э2).
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      permission:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.AddGroupMemberRequest:
    properties:
      users:
        items:
          type: string
        type: array
    type: object
  dto.AddGroupMemberResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/dto.GroupMember'
        type: array
    type: object
  dto.AssignmentCounters:
    properties:
      assigned:
        type: integer
      cancelled:
        type: integer
      completed:
        type: integer
      in_progress:
        type: integer
      overdue:
        type: integer
      total:
        type: integer
    type: object
  dto.AssignmentDetails:
    properties:
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      comment:
        type: string
      counters:
        $ref: '#/definitions/dto.AssignmentCounters'
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/dto.AssignmentUser'
      due_at:
        type: string
      due_days:
        type: integer
      due_mode:
        type: string
      events:
        items:
          $ref: '#/definitions/dto.AssignmentEvent'
        type: array
      group_id:
        type: string
      group_name:
        type: string
      id:
        type: string
      participants:
        items:
          $ref: '#/definitions/dto.AssignmentParticipant'
        type: array
      status:
        type: string
      targets:
        items:
          $ref: '#/definitions/dto.AssignmentTarget'
        type: array
      video_id:
        type: string
      video_name:
        type: string
    type: object
  dto.AssignmentEvent:
    properties:
      actor:
        $ref: '#/definitions/dto.AssignmentUser'
      created_at:
        type: string
      id:
        type: integer
      payload:
        type: object
      type:
        type: string
      user_id:
        type: string
    type: object
  dto.AssignmentParticipant:
    properties:
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      completed_at:
        type: string
      completed_late:
        type: boolean
      coverage_pct:
        type: integer
      due_at:
        type: string
      enrolled_at:
        type: string
      has_access:
        type: boolean
      is_overdue:
        type: boolean
      source:
        type: string
      source_group_id:
        type: string
      status:
        type: string
      user:
        $ref: '#/definitions/dto.AssignmentUser'
    type: object
  dto.AssignmentTarget:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  dto.AssignmentUser:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      surname:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CompleteVideoUploadResponse:
    properties:
      video:
        $ref: '#/definitions/dto.Video'
    type: object
  dto.ConfigResponse:
    properties:
      allowed_content_types:
        description: AllowedContentTypes — допустимые MIME-типы загружаемого видео.
        items:
          type: string
        type: array
      completion_threshold:
        description: |-
          CompletionThreshold — доля покрытия видео (0;1], после которой просмотр считается
          подтверждённым (В-1 решение владельца, §3 дизайна эпика Э3).
        type: number
      heartbeat_seconds:
        description: |-
          HeartbeatSeconds — ожидаемый период отправки heartbeat'ов плеером, секунды (§3 дизайна
          эпика Э3).
        type: integer
      hls_url_ttl_seconds:
        description: HLSURLTTLSeconds — время жизни HLS-токена доступа к мастер-плейлисту,
          секунды.
        type: integer
      max_upload_size_bytes:
        description: MaxUploadSizeBytes — максимальный размер файла видео для загрузки
          в байтах.
        type: integer
      password_min_length:
        description: PasswordMinLength — минимальная длина пароля пользователя.
        type: integer
      profiles:
        description: Profiles — имена профилей качества HLS, в которые обрабатывается
          видео.
        items:
          type: string
        type: array
      token_ttl_seconds:
        description: TokenTTLSeconds — время жизни токена авторизации, секунды.
        type: integer
      upload_url_ttl_seconds:
        description: UploadURLTTLSeconds — время жизни преподписанного URL на загрузку
          оригинала, секунды.
        type: integer
    type: object
  dto.CreateAccountRoleRequest:
    properties:
      is_default:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      permission:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.CreateAccountRoleResponse:
    properties:
      account_role:
        $ref: '#/definitions/dto.AccountRole'
    type: object
  dto.CreateAssignmentRequest:
    properties:
      comment:
        maxLength: 500
        type: string
      due_at:
        type: string
      due_days:
        type: integer
      due_mode:
        enum:
        - date
        - days
        type: string
      groups:
        items:
          type: string
        type: array
      users:
        items:
          type: string
        type: array
      video_id:
        type: string
    required:
    - due_mode
    - video_id
    type: object
  dto.CreateAssignmentResponse:
    properties:
      assignment:
        $ref: '#/definitions/dto.AssignmentDetails'
      rejected:
        items:
          $ref: '#/definitions/dto.RejectedTarget'
        type: array
    type: object
  dto.CreateGroupRoleRequest:
    properties:
      is_default:
        type: boolean
      name:
        type: string
      permission_mask:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.CreateGroupRoleResponse:
    properties:
      role:
        $ref: '#/definitions/dto.GroupRole'
    type: object
  dto.CreateUserGroupRequest:
    properties:
      name:
        maxLength: 64
        type: string
      users:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  dto.CreateUserGroupResponse:
    properties:
      id:
        type: string
      name:
        type: string
      users:
        items:
          $ref: '#/definitions/dto.GroupMember'
        type: array
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      surname:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - email
    - name
    - surname
    type: object
  dto.CreateUserResponse:
    properties:
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.ErrorMessage:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      account_id:
        type: string
      email:
        maxLength: 64
        type: string
    required:
    - email
    type: object
  dto.ForgotPasswordResponse:
    type: object
  dto.GetAllUserGroupsResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/dto.UserGroup'
        type: array
    type: object
  dto.GetAllUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/dto.User'
        type: array
    type: object
  dto.GetAllVideosResponse:
    properties:
      videos:
        items:
          $ref: '#/definitions/dto.Video'
        type: array
    type: object
  dto.GetAssignmentResponse:
    properties:
      assignment:
        $ref: '#/definitions/dto.AssignmentDetails'
    type: object
  dto.GetGroupMembersResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/dto.GroupMemberDetails'
        type: array
    type: object
  dto.GetUserGroupResponse:
    properties:
      group:
        $ref: '#/definitions/dto.UserGroup'
    type: object
  dto.GetVideoResponse:
    properties:
      expires_at:
        type: string
      kind:
        type: string
      profiles:
        items:
          type: string
        type: array
      status:
        type: integer
      status_name:
        type: string
      url:
        type: string
    type: object
  dto.GroupMember:
    properties:
      group_id:
        type: string
      joined_at:
        type: string
      role_id:
        type: string
      user_id:
        type: string
    type: object
  dto.GroupMemberDetails:
    properties:
      email:
        type: string
      joined_at:
        type: string
      name:
        type: string
      permission_mask:
        $ref: '#/definitions/domain.PermissionMask'
      role_id:
        type: string
      role_name:
        type: string
      surname:
        type: string
      user_id:
        type: string
    type: object
  dto.GroupRole:
    properties:
      account_id:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      permission_mask:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.HealthResponse:
    properties:
      status:
        description: Status — состояние сервиса, при успешной проверке всегда "ok".
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 64
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
    type: object
  dto.MeResponse:
    properties:
      account:
        $ref: '#/definitions/dto.AccountBrief'
      accounts:
        items:
          $ref: '#/definitions/dto.AccountBrief'
        type: array
      groups:
        items:
          $ref: '#/definitions/dto.MyGroup'
        type: array
      is_owner:
        type: boolean
      role:
        $ref: '#/definitions/dto.AccountRole'
      user:
        $ref: '#/definitions/dto.MeUser'
    type: object
  dto.MeUser:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      surname:
        type: string
    type: object
  dto.MyAssignment:
    properties:
      assigned_by:
        $ref: '#/definitions/dto.AssignmentUser'
      cancelled_at:
        type: string
      comment:
        type: string
      completed_at:
        type: string
      completed_late:
        type: boolean
      coverage_pct:
        type: integer
      due_at:
        type: string
      enrolled_at:
        type: string
      id:
        type: string
      is_overdue:
        type: boolean
      source:
        type: string
      status:
        type: string
      video:
        $ref: '#/definitions/dto.MyAssignmentVideo'
    type: object
  dto.MyAssignmentVideo:
    properties:
      duration_ms:
        type: integer
      group_id:
        type: string
      group_name:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      name:
        type: string
      status:
        type: integer
      status_name:
        type: string
    type: object
  dto.MyAssignmentsResponse:
    properties:
      active_count:
        type: integer
      assignments:
        items:
          $ref: '#/definitions/dto.MyAssignment'
        type: array
      overdue_count:
        type: integer
    type: object
  dto.MyGroup:
    properties:
      id:
        type: string
      name:
        type: string
      permission_mask:
        $ref: '#/definitions/domain.PermissionMask'
      role_id:
        type: string
      role_name:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      surname:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - email
    - name
    - surname
    type: object
  dto.RegisterResponse:
    type: object
  dto.RejectedTarget:
    properties:
      email:
        type: string
      name:
        type: string
      reason:
        type: string
      surname:
        type: string
      user_id:
        type: string
    type: object
  dto.RenameVideoRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.RenameVideoResponse:
    properties:
      video:
        $ref: '#/definitions/dto.Video'
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.ResetPasswordResponse:
    type: object
  dto.SwitchAccountRequest:
    properties:
      account_id:
        type: string
    required:
    - account_id
    type: object
  dto.SwitchAccountResponse:
    properties:
      token:
        type: string
    type: object
  dto.UpdateAccountRoleRequest:
    properties:
      is_default:
        type: boolean
      name:
        maxLength: 64
        type: string
      parent_id:
        type: string
      permission:
        $ref: '#/definitions/domain.PermissionMask'
    required:
    - name
    type: object
  dto.UpdateAccountRoleResponse:
    properties:
      account_role:
        $ref: '#/definitions/dto.AccountRole'
    type: object
  dto.UpdateAssignmentRequest:
    properties:
      comment:
        maxLength: 500
        type: string
      due_at:
        type: string
      due_days:
        type: integer
      due_mode:
        enum:
        - date
        - days
        type: string
    type: object
  dto.UpdateAssignmentResponse:
    properties:
      assignment:
        $ref: '#/definitions/dto.AssignmentDetails'
    type: object
  dto.UpdateGroupMemberRequest:
    properties:
      role_id:
        type: string
    required:
    - role_id
    type: object
  dto.UpdateGroupMemberResponse:
    properties:
      member:
        $ref: '#/definitions/dto.GroupMemberDetails'
    type: object
  dto.UpdateGroupRoleRequest:
    properties:
      is_default:
        type: boolean
      name:
        maxLength: 64
        type: string
      permission_mask:
        $ref: '#/definitions/domain.PermissionMask'
    required:
    - name
    type: object
  dto.UpdateGroupRoleResponse:
    properties:
      role:
        $ref: '#/definitions/dto.GroupRole'
    type: object
  dto.UpdateUserGroupRequest:
    properties:
      name:
        maxLength: 64
        type: string
    required:
    - name
    type: object
  dto.UpdateUserGroupResponse:
    properties:
      group:
        $ref: '#/definitions/dto.UserGroup'
    type: object
  dto.UpdateUserRequest:
    properties:
      name:
        maxLength: 64
        minLength: 2
        type: string
      role_id:
        type: string
      surname:
        maxLength: 64
        minLength: 2
        type: string
    type: object
  dto.UpdateUserResponse:
    properties:
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.UploadVideoRequest:
    properties:
      content_type:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      size_bytes:
        type: integer
    required:
    - content_type
    - name
    - size_bytes
    type: object
  dto.UploadVideoResponse:
    properties:
      expires_at:
        type: string
      upload_url:
        type: string
      video_id:
        type: string
    type: object
  dto.User:
    properties:
      deactivated_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role_id:
        type: string
      status:
        type: string
      surname:
        type: string
    type: object
  dto.UserGroup:
    properties:
      account_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.Video:
    properties:
      author:
        $ref: '#/definitions/dto.VideoAuthor'
      created_at:
        type: string
      duration_ms:
        description: DurationMs — длительность видео в миллисекундах, известна после
          успешной обработки.
        type: integer
      failure:
        allOf:
        - $ref: '#/definitions/dto.VideoFailure'
        description: |-
          Failure — причина сбоя обработки видео, заполняется только для инициатора с правом
          ManageVideo (Э1-Т17); для остальных — всегда null, даже если видео в статусе failed.
      group_id:
        type: string
      has_processed:
        description: HasProcessed — признак наличия обработанной версии (готового
          мастер-плейлиста HLS).
        type: boolean
      height:
        description: Height — высота кадра оригинала в пикселях, известна после успешной
          обработки.
        type: integer
      id:
        type: string
      name:
        type: string
      profiles:
        description: |-
          Profiles — имена HLS-профилей видео по возрастанию качества (пустой список, пока
          профилей нет).
        items:
          type: string
        type: array
      status:
        type: integer
      status_name:
        type: string
      width:
        description: Width — ширина кадра оригинала в пикселях, известна после успешной
          обработки.
        type: integer
    type: object
  dto.VideoAuthor:
    properties:
      id:
        type: string
      name:
        type: string
      surname:
        type: string
    type: object
  dto.VideoFailure:
    properties:
      class:
        description: 'Class — класс ошибки: permanent, temporary, timeout.'
        type: string
      reason:
        description: Reason — человекочитаемая причина сбоя.
        type: string
    type: object
  dto.WatchHeartbeatRequest:
    properties:
      client_ts:
        description: ClientTS — время клиента на момент отправки, используется только
          в логе.
        type: string
      from_ms:
        description: FromMs — начало присланного отрезка воспроизведения в миллисекундах.
        minimum: 0
        type: integer
      playback_rate:
        description: |-
          PlaybackRate — скорость воспроизведения; выше 1.0 отбрасывает интервал целиком (В-1
          решение владельца).
        type: number
      position_ms:
        description: PositionMs — текущая позиция плеера, используется для «продолжить
          с».
        minimum: 0
        type: integer
      seq:
        description: Seq — порядковый номер heartbeat'а в рамках сессии, обеспечивает
          идемпотентность повторов.
        minimum: 1
        type: integer
      session_id:
        description: SessionID — идентификатор сессии просмотра, генерируется клиентом
          при открытии плеера.
        type: string
      to_ms:
        description: |-
          ToMs — конец присланного отрезка; ToMs == FromMs означает отсутствие воспроизведения
          (пауза или перемотка) с прошлого heartbeat'а.
        minimum: 0
        type: integer
    required:
    - playback_rate
    - seq
    - session_id
    type: object
  dto.WatchProgressResponse:
    properties:
      accepted:
        type: boolean
      completed:
        type: boolean
      coverage_pct:
        type: integer
      covered_ms:
        type: integer
      duration_ms:
        type: integer
      last_position_ms:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для управления внутренней видео документацией Vilib.
  title: Vilib API
  version: "1.0"
paths:
  /api/health:
    get:
      description: Возвращает 200, если процесс API запущен и обрабатывает запросы;
        используется healthcheck'ом контейнера
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Проверка работоспособности сервиса
      tags:
      - health
  /api/v1/accounts/{accountId}/assignments:
    post:
      consumes:
      - application/json
      description: |-
        Назначает видео пользователям и/или группе со сроком и комментарием (§4
        дизайна эпика Э3): раскрывает цели в персональные записи, отклонённые (нет
        доступа/деактивирован/не в аккаунте) возвращаются в rejected, а не ошибкой.
        Цель-группа допустима только для группы, которой принадлежит видео.
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAssignmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateAssignmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Назначение обязательного обучения
      tags:
      - assignments
  /api/v1/accounts/{accountId}/assignments/{assignmentId}:
    delete:
      description: |-
