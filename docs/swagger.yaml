basePath: /api/v1
definitions:
  domain.PermissionMask:
    enum:
    - 0
    format: int64
    type: integer
    x-enum-varnames:
    - DefaultPermissionMask
  dto.AccountRole:
    properties:
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      permission:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.AddGroupMemberRequest:
    properties:
      users:
        items:
          type: string
        type: array
    type: object
  dto.AddGroupMemberResponse:
    properties:
      members:
        items:
          $ref: '#/definitions/dto.GroupMember'
        type: array
    type: object
  dto.CompleteVideoUploadResponse:
    properties:
      video:
        $ref: '#/definitions/dto.Video'
    type: object
  dto.CreateAccountRoleRequest:
    properties:
      is_default:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      permission:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.CreateAccountRoleResponse:
    properties:
      account_role:
        $ref: '#/definitions/dto.AccountRole'
    type: object
  dto.CreateGroupRoleRequest:
    properties:
      is_default:
        type: boolean
      name:
        type: string
      permission_mask:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.CreateGroupRoleResponse:
    properties:
      role:
        $ref: '#/definitions/dto.GroupRole'
    type: object
  dto.CreateUserGroupRequest:
    properties:
      name:
        maxLength: 64
        type: string
      users:
        items:
          type: string
        type: array
    required:
    - name
    - users
    type: object
  dto.CreateUserGroupResponse:
    properties:
      id:
        type: string
      name:
        type: string
      users:
        items:
          $ref: '#/definitions/dto.GroupMember'
        type: array
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      surname:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - email
    - name
    - surname
    type: object
  dto.CreateUserResponse:
    properties:
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.ErrorMessage:
    properties:
      message:
        type: string
    type: object
  dto.GetAllUserGroupsResponse:
    properties:
      groups:
        items:
          $ref: '#/definitions/dto.UserGroup'
        type: array
    type: object
  dto.GetAllUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/dto.User'
        type: array
    type: object
  dto.GetAllVideosResponse:
    properties:
      videos:
        items:
          $ref: '#/definitions/dto.Video'
        type: array
    type: object
  dto.GetVideoResponse:
    properties:
      expires_at:
        type: string
      kind:
        type: string
      profiles:
        items:
          type: string
        type: array
      status:
        type: integer
      status_name:
        type: string
      url:
        type: string
    type: object
  dto.GroupMember:
    properties:
      group_id:
        type: string
      role_id:
        type: string
      user_id:
        type: string
    type: object
  dto.GroupRole:
    properties:
      account_id:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      permission_mask:
        $ref: '#/definitions/domain.PermissionMask'
    type: object
  dto.HealthResponse:
    properties:
      status:
        description: Status — состояние сервиса, при успешной проверке всегда "ok".
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 64
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        maxLength: 64
        type: string
      name:
        maxLength: 64
        minLength: 2
        type: string
      surname:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - email
    - name
    - surname
    type: object
  dto.RegisterResponse:
    type: object
  dto.RenameVideoRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.RenameVideoResponse:
    properties:
      video:
        $ref: '#/definitions/dto.Video'
    type: object
  dto.UpdateUserRequest:
    properties:
      role_id:
        type: string
    type: object
  dto.UpdateUserResponse:
    properties:
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.UploadVideoRequest:
    properties:
      content_type:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      size_bytes:
        type: integer
    required:
    - content_type
    - name
    - size_bytes
    type: object
  dto.UploadVideoResponse:
    properties:
      expires_at:
        type: string
      upload_url:
        type: string
      video_id:
        type: string
    type: object
  dto.User:
    properties:
      deactivated_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role_id:
        type: string
      status:
        type: string
      surname:
        type: string
    type: object
  dto.UserGroup:
    properties:
      account_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.Video:
    properties:
      author:
        type: string
      created_at:
        type: string
      duration_ms:
        description: DurationMs — длительность видео в миллисекундах, известна после
          успешной обработки.
        type: integer
      failure:
        allOf:
        - $ref: '#/definitions/dto.VideoFailure'
        description: |-
          Failure — причина сбоя обработки видео, заполняется только для инициатора с правом
          ManageVideo (Э1-Т17); для остальных — всегда null, даже если видео в статусе failed.
      group_id:
        type: string
      has_processed:
        description: HasProcessed — признак наличия обработанной версии (готового
          мастер-плейлиста HLS).
        type: boolean
      height:
        description: Height — высота кадра оригинала в пикселях, известна после успешной
          обработки.
        type: integer
      id:
        type: string
      name:
        type: string
      profiles:
        description: |-
          Profiles — имена HLS-профилей видео по возрастанию качества (пустой список, пока
          профилей нет).
        items:
          type: string
        type: array
      status:
        type: integer
      status_name:
        type: string
      width:
        description: Width — ширина кадра оригинала в пикселях, известна после успешной
          обработки.
        type: integer
    type: object
  dto.VideoFailure:
    properties:
      class:
        description: 'Class — класс ошибки: permanent, temporary, timeout.'
        type: string
      reason:
        description: Reason — человекочитаемая причина сбоя.
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для управления внутренней видео документацией Vilib.
  title: Vilib API
  version: "1.0"
paths:
  /api/health:
    get:
      description: Возвращает 200, если процесс API запущен и обрабатывает запросы;
        используется healthcheck'ом контейнера
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Проверка работоспособности сервиса
      tags:
      - health
  /api/v1/accounts/{accountId}/roles:
    get:
      description: Возвращает список всех ролей аккаунта
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AccountRole'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Список ролей аккаунта
      tags:
      - account_roles
    post:
      consumes:
      - application/json
      description: Создаёт новую роль для аккаунта с указанными правами
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: Тело запроса для создания роли
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAccountRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateAccountRoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Создание роли аккаунта
      tags:
      - account_roles
  /api/v1/accounts/{accountId}/roles/{roleId}:
    delete:
      description: Удаляет роль аккаунта. Нельзя удалить системную роль или роль,
        назначенную активным пользователям.
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID роли
        in: path
        name: roleId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Удаление роли аккаунта
      tags:
      - account_roles
  /api/v1/accounts/{accountId}/user-groups:
    get:
      description: Возвращает список групп пользователей аккаунта
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetAllUserGroupsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Список групп пользователей
      tags:
      - user_groups
    post:
      consumes:
      - application/json
      description: Создаёт новую группу пользователей и добавляет указанных пользователей
        в неё
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: Тело запроса для создания группы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateUserGroupResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Создание группы пользователей
      tags:
      - user_groups
  /api/v1/accounts/{accountId}/user-groups/{groupId}/members:
    post:
      consumes:
      - application/json
      description: Добавляет указанных пользователей в существующую группу
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы пользователей
        in: path
        name: groupId
        required: true
        type: string
      - description: Тело запроса для добавления участников
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddGroupMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AddGroupMemberResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Добавление участников в группу
      tags:
      - user_groups
  /api/v1/accounts/{accountId}/user-groups/{groupId}/video:
    post:
      consumes:
      - application/json
      description: Создаёт запись видео в статусе загрузки и возвращает преподписанный
        URL для загрузки оригинала в S3
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы пользователей
        in: path
        name: groupId
        required: true
        type: string
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UploadVideoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UploadVideoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      summary: Создание загрузки видео
      tags:
      - videos
  /api/v1/accounts/{accountId}/user-groups/{groupId}/video/{videoId}:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает точку доступа к видео по статусу (§4.4 дизайна эпика): для готового
        видео без is_prefer_original — URL мастер-плейлиста HLS с HLS-токеном в query,
        иначе — преподписанный URL на оригинал. Возвращает 409, если видео недоступно
        (ещё загружается или обработка завершилась ошибкой без сохранённого оригинала).
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы пользователей
        in: path
        name: groupId
        required: true
        type: string
      - description: ID видео
        in: path
        name: videoId
        required: true
        type: string
      - description: Предпочитать оригинальное видео
        in: query
        name: is_prefer_original
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetVideoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      summary: Получение точки доступа к видео
      tags:
      - videos
  /api/v1/accounts/{accountId}/user-groups/{groupId}/video/{videoId}/complete:
    post:
      description: |-
        Подтверждает, что оригинал видео загружен в хранилище: проверяет объект,
        регистрирует ассет-оригинал и переводит видео в очередь на обработку.
        Повторный вызов для видео, уже поставленного в очередь, обрабатываемого или готового, идемпотентен.
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы пользователей
        in: path
        name: groupId
        required: true
        type: string
      - description: ID видео
        in: path
        name: videoId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CompleteVideoUploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      summary: Подтверждение загрузки видео
      tags:
      - videos
  /api/v1/accounts/{accountId}/user-groups/{groupId}/video/{videoId}/hls/{profile}/playlist.m3u8:
    get:
      description: |-
        Отдаёт медиаплейлист HLS-профиля видео, переписывая имена сегментов
        преподписанными URL хранилища. Доступ проверяется HLS-токеном в query — ручка
        не проходит RequireAuthMiddleware (§4.2 дизайна эпика).
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы пользователей
        in: path
        name: groupId
        required: true
        type: string
      - description: ID видео
        in: path
        name: videoId
        required: true
        type: string
      - description: Имя профиля качества (например, 720p)
        in: path
        name: profile
        required: true
        type: string
      - description: HLS-токен, выданный GET-ручкой видео
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/vnd.apple.mpegurl
      responses:
        "200":
          description: Медиаплейлист HLS-профиля
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      summary: Медиаплейлист HLS-профиля
      tags:
      - videos
  /api/v1/accounts/{accountId}/user-groups/{groupId}/video/{videoId}/hls/master.m3u8:
    get:
      description: |-
        Отдаёт мастер-плейлист HLS-выдачи видео, переписывая URI вариантов ссылками
        с тем же HLS-токеном. Доступ проверяется токеном в query, а не заголовком
        Authorization — ручка не проходит RequireAuthMiddleware (§4.2 дизайна эпика).
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы пользователей
        in: path
        name: groupId
        required: true
        type: string
      - description: ID видео
        in: path
        name: videoId
        required: true
        type: string
      - description: HLS-токен, выданный GET-ручкой видео
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/vnd.apple.mpegurl
      responses:
        "200":
          description: Мастер-плейлист HLS
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
      summary: Мастер-плейлист HLS
      tags:
      - videos
  /api/v1/accounts/{accountId}/user-groups/{userGroupId}:
    delete:
      description: Каскадно удаляет группу вместе со всеми видео, участниками и ассетами
      parameters:
      - description: ID аккаунта
        in: path
        name: accountId
        required: true
        type: string
      - description: ID группы
        in: path
        name: userGroupId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorMessage'
      summary: Удаление группы пользователей
      tags:
